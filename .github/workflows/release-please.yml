name: release-please
on:
  push:
    branches: [main]
permissions: { contents: write, pull-requests: write, id-token: write }
jobs:
  release-please:
    runs-on: ubuntu-latest
    # ponytail: secrets context is banned in step if lines, so bridge via env.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          {
            node-version: 24,
            registry-url: https://registry.npmjs.org,
            cache: pnpm,
          }
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}
      # ponytail: OIDC trusted publishing first, NPM_TOKEN fallback.
      # Configure ONE of these on npmjs.com / GitHub secrets, else publish 404s.
      - run: npm publish --access public --provenance
        if: ${{ steps.release.outputs.release_created && env.NPM_TOKEN == '' }}
      - run: npm publish --access public
        if: ${{ steps.release.outputs.release_created && env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
